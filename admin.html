<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MtaaFix Admin | Provider approvals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
    <main class="admin-shell">
        <a class="brand" href="index.html"><span class="brand-mark">M</span><span>Mtaa<span>Fix</span></span></a>
        <section id="login-panel" class="admin-panel">
            <div class="eyebrow">Private workspace</div>
            <h1>Approve local providers.</h1>
            <p>Sign in with the MtaaFix admin email to review fundi registrations before they appear to customers.</p>
            <form id="admin-login" class="admin-form"><label for="admin-email">Admin email</label><input id="admin-email" type="email" value="kingaraash508@gmail.com" readonly><button class="button button-primary" type="submit">Send sign-in link <span>↗</span></button><small id="login-message" class="form-note"></small></form>
        </section>
        <section id="dashboard-panel" class="admin-panel" hidden>
            <div class="admin-heading"><div><div class="eyebrow">MtaaFix control room</div><h1>Provider approvals.</h1></div><button id="logout" class="admin-logout">Sign out</button></div>
            <p>Review the details, then approve providers to make them visible in customer matches.</p>
            <div id="provider-list" class="admin-list"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const adminEmail = 'kingaraash508@gmail.com';
        const client = window.supabase.createClient(window.MTAAFIX_SUPABASE.url, window.MTAAFIX_SUPABASE.anonKey);
        const loginPanel = document.querySelector('#login-panel');
        const dashboardPanel = document.querySelector('#dashboard-panel');
        const loginMessage = document.querySelector('#login-message');
        const providerList = document.querySelector('#provider-list');

        const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
        const showMessage = (message) => { loginMessage.textContent = message; };
        const checkAdmin = async () => {
            const { data: { session } } = await client.auth.getSession();
            if (!session) { loginPanel.hidden = false; dashboardPanel.hidden = true; return; }
            if (session.user.email !== adminEmail) { await client.auth.signOut(); showMessage('This sign-in is not the MtaaFix admin account.'); return; }
            loginPanel.hidden = true;
            dashboardPanel.hidden = false;
            await loadProviders();
        };
        const loadProviders = async () => {
            const { data, error } = await client.from('providers').select('*').eq('approved', false).order('created_at', { ascending: false });
            if (error) { providerList.innerHTML = `<div class="empty-match">${escapeHtml(error.message)}</div>`; return; }
            providerList.innerHTML = data.length ? data.map((provider) => `<article class="admin-provider"><div><strong>${escapeHtml(provider.name)}</strong><p>${escapeHtml(provider.service)} · ${escapeHtml(provider.area)} · ${escapeHtml(provider.phone)}</p></div><button class="button button-primary approve-provider" data-id="${provider.id}">Approve <span>✓</span></button></article>`).join('') : '<div class="empty-match"><strong>No pending providers.</strong><p>New fundi registrations will appear here.</p></div>';
            document.querySelectorAll('.approve-provider').forEach((button) => button.addEventListener('click', async () => {
                button.disabled = true;
                const { error } = await client.from('providers').update({ approved: true }).eq('id', button.dataset.id);
                if (error) { button.disabled = false; alert(error.message); return; }
                await loadProviders();
            }));
        };
        document.querySelector('#admin-login').addEventListener('submit', async (event) => {
            event.preventDefault();
            showMessage('Sending your secure sign-in link...');
            const { error } = await client.auth.signInWithOtp({ email: adminEmail, options: { emailRedirectTo: `${window.location.origin}${window.location.pathname}` } });
            showMessage(error ? error.message : 'Check your email and open the sign-in link on this device.');
        });
        document.querySelector('#logout').addEventListener('click', () => client.auth.signOut());
        client.auth.onAuthStateChange(() => checkAdmin());
        checkAdmin();
    </script>
</body>
</html>
